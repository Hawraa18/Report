<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حوراء علي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: #2b1b0e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .scene {
            position: relative;
            width: 900px;
            height: 500px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        
        .sky {
            position: absolute;
            width: 100%;
            height: 55%;
            background: linear-gradient(to bottom, #ff4d1e, #ff8c42, #ffb347);
            animation: skyColors 8s infinite alternate;
        }
        
        .sun {
            position: absolute;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #fff2b5, #ffaa33);
            border-radius: 50%;
            top: 30%;
            left: 60%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 100px #ffaa33;
        }
        
        .sea {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 45%;
            background: linear-gradient(to bottom, #ff7f2a, #b34b1a, #6b2e0e);
            overflow: hidden;
        }
        
        .wave {
            position: absolute;
            width: 200%;
            height: 100%;
            background: repeating-linear-gradient(0deg, 
                transparent 0px, 
                transparent 18px, 
                rgba(255, 200, 100, 0.35) 18px, 
                rgba(255, 140, 50, 0.5) 24px);
            animation: moveWave 8s linear infinite;
        }
        
        .wave2 {
            position: absolute;
            width: 200%;
            height: 100%;
            background: repeating-linear-gradient(45deg, 
                transparent 0px, 
                transparent 25px, 
                rgba(255, 180, 70, 0.25) 25px, 
                rgba(200, 90, 20, 0.35) 35px);
            animation: moveWaveReverse 14s linear infinite;
            opacity: 0.8;
        }
        
        .reflection {
            position: absolute;
            width: 150px;
            height: 220px;
            background: linear-gradient(to bottom, rgba(255, 220, 120, 0.9), rgba(255, 100, 20, 0.3));
            top: 42%;
            left: 60%;
            transform: translate(-50%, 0) skewX(-3deg);
            filter: blur(12px);
            border-radius: 40% 40% 50% 50%;
            animation: reflectionDance 4s infinite alternate;
        }
        
        .cloud {
            position: absolute;
            background: rgba(255, 180, 130, 0.4);
            border-radius: 50px;
            filter: blur(10px);
            animation: cloudMove 30s linear infinite;
        }
        
        .cloud1 {
            width: 140px;
            height: 45px;
            top: 12%;
            left: -10%;
        }
        
        .cloud2 {
            width: 200px;
            height: 60px;
            top: 22%;
            left: -20%;
            animation-delay: -8s;
            background: rgba(255, 150, 100, 0.35);
        }
        
        .cloud3 {
            width: 160px;
            height: 50px;
            top: 35%;
            left: -15%;
            animation-delay: -16s;
            background: rgba(230, 120, 70, 0.3);
        }
        
        .bird {
            position: absolute;
            color: #3a281c;
            font-size: 22px;
            opacity: 0.6;
            filter: drop-shadow(0 2px 4px #ffb56b);
            animation: birdFly 20s linear infinite;
            z-index: 15;
        }
        
        .bird1 {
            top: 18%;
            left: -5%;
            transform: scale(0.9);
        }
        
        .bird2 {
            top: 28%;
            left: -10%;
            animation-delay: -7s;
            transform: scale(0.7);
        }
        
        .bird3 {
            top: 10%;
            left: -15%;
            animation-delay: -14s;
            transform: scale(0.8);
            font-size: 18px;
        }
        
        .name-small {
            position: absolute;
            bottom: 15px;
            left: 20px;
            color: rgba(255, 245, 200, 0.95);
            font-size: 18px;
            font-weight: 500;
            text-shadow: 2px 2px 5px #b34b1a;
            z-index: 30;
            background: rgba(100, 40, 10, 0.4);
            padding: 6px 16px;
            border-radius: 40px;
            backdrop-filter: blur(3px);
            border: 1px solid #ffb347;
            font-family: 'Arial', sans-serif;
            letter-spacing: 0.5px;
        }
        
        .bird::before {
            content: "🕊️";
            display: inline-block;
        }
        
        @keyframes skyColors {
            0% { background: linear-gradient(to bottom, #ff4d1e, #ff8c42, #ffb347); }
            100% { background: linear-gradient(to bottom, #ff3333, #ff7b24, #ffaa33); }
        }
        
        @keyframes moveWave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        
        @keyframes moveWaveReverse {
            0% { transform: translateX(-50%) translateY(2px); }
            50% { transform: translateX(-25%) translateY(-2px); }
            100% { transform: translateX(0) translateY(2px); }
        }
        
        @keyframes reflectionDance {
            0% { transform: translate(-50%, 0) skewX(-3deg) scaleY(1); opacity: 0.8; }
            100% { transform: translate(-50%, 8px) skewX(-7deg) scaleY(1.2); opacity: 1; }
        }
        
        @keyframes cloudMove {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(500%); }
        }
        
        @keyframes birdFly {
            0% { transform: translateX(-100%) translateY(0); }
            25% { transform: translateX(50%) translateY(-12px); }
            50% { transform: translateX(200%) translateY(0); }
            75% { transform: translateX(350%) translateY(10px); }
            100% { transform: translateX(500%) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="sky"></div>
        <div class="sun"></div>
        
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        
        <div class="bird bird1"></div>
        <div class="bird bird2"></div>
        <div class="bird bird3"></div>
        
        <div class="name-small">
            ⚘ حوراء علي
        </div>
        
        <div class="sea">
            <div class="wave"></div>
            <div class="wave2"></div>
        </div>
        
        <div class="reflection"></div>
    </div>
</body>
</html>
